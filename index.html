<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrollytelling Parallax Editor Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Fira+Code:wght@400;600&family=Inter:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,300;0,700;1,300&family=Montserrat:wght@400;600;800&family=Oswald:wght@500;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; overflow: hidden; }

    /* App Layout */
    #app-container { display: flex; height: 100vh; width: 100vw; }
    
    /* Control Panel (Sidebar) */
    #editor-sidebar {
      width: 440px;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 4px 0 20px rgba(0,0,0,0.3);
    }
    .sidebar-header {
      padding: 16px 20px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }
    .sidebar-header h2 { font-size: 1.1rem; color: #38bdf8; font-weight: 600; margin-bottom: 10px; }

    /* Project Manager Bar */
    .project-bar {
      background: #1e293b;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .project-bar select {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      color: #38bdf8;
      padding: 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .project-btn-row { display: flex; gap: 4px; }
    .btn-sm { padding: 6px 8px; font-size: 0.75rem; border-radius: 4px; cursor: pointer; border: none; font-weight: 600; flex: 1; }
    .btn-dark { background: #334155; color: #e2e8f0; }
    .btn-dark:hover { background: #475569; }
    .btn-danger { background: #991b1b; color: #fecaca; }
    .btn-danger:hover { background: #b91c1c; }

    .scenes-list { flex: 1; overflow-y: auto; padding: 16px; }
    
    /* Scene Card in Editor */
    .scene-card {
      background: #334155;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid #475569;
      position: relative;
    }
    .scene-card h3 { font-size: 0.9rem; color: #38bdf8; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    
    /* Form Elements */
    .form-group { margin-bottom: 12px; }
    .form-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .form-row .form-group { flex: 1; margin-bottom: 0; }
    .form-group label { display: block; font-size: 0.75rem; color: #cbd5e1; margin-bottom: 4px; font-weight: 600; }
    .form-group input[type="text"], 
    .form-group textarea, 
    .form-group select {
      width: 100%;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 8px;
      color: #fff;
      font-size: 0.85rem;
    }
    .form-group input[type="color"] {
      width: 100%;
      height: 36px;
      border: 1px solid #475569;
      background: #1e293b;
      border-radius: 4px;
      cursor: pointer;
    }
    .form-group input[type="range"] { width: 100%; }
    .range-val { font-size: 0.75rem; color: #38bdf8; float: right; }
    
    .btn-delete {
      position: absolute;
      top: 14px; right: 14px;
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .sidebar-actions { padding: 16px; border-top: 1px solid #334155; display: flex; gap: 8px; background: #0f172a; }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-primary:hover { background: #0369a1; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-success:hover { background: #15803d; }

    /* Live Preview Area */
    #preview-viewport {
      flex: 1;
      overflow-y: auto;
      height: 100vh;
      position: relative;
      background: #000;
      scroll-behavior: smooth;
    }

    /* Scrollytelling Stage Styles */
    .scrolly-container { position: relative; width: 100%; }
    .scrolly-section { position: relative; width: 100%; }

    /* Sticky Media Stage */
    .sticky-media-wrapper {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      z-index: 1;
    }
    .sticky-media-wrapper img,
    .sticky-media-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      will-change: transform;
    }

    /* Foreground Overlay Stage */
    .sticky-overlay-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
      display: flex;
    }
    .sticky-overlay-wrapper img,
    .sticky-overlay-wrapper video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      will-change: transform;
    }
    
    /* Overlay Positions */
    .overlay-center { justify-content: center; align-items: center; }
    .overlay-right-bottom { justify-content: flex-end; align-items: flex-end; }
    .overlay-left-bottom { justify-content: flex-start; align-items: flex-end; }
    .overlay-right-top { justify-content: flex-end; align-items: flex-start; }

    /* Text Block Container Overlay */
    .text-content-wrapper {
      position: relative;
      z-index: 2;
      pointer-events: none;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
    }
    
    /* Position Classes */
    .pos-left { justify-content: flex-start; }
    .pos-center { justify-content: center; }
    .pos-right { justify-content: flex-end; }

    .text-card {
      max-width: 500px;
      width: 100%;
      margin-bottom: 80vh;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
      transition: background 0.2s ease, color 0.2s ease;
    }
    .text-card h2 { margin-bottom: 12px; line-height: 1.2; }
    .text-card p { line-height: 1.6; }

    /* Word-by-Word Floating Entrance Effect - FIXED WHITESPACE BUG */
    .word-span {
      display: inline-block;
      white-space: pre-wrap;
      opacity: 0;
      transform: translateY(18px);
      will-change: transform, opacity;
    }

    .text-card.animate-words .word-span {
      animation: wordFloatIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(var(--word-index) * 0.025s);
    }

    @keyframes wordFloatIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Size Classes */
    .h-sm { font-size: 1.3rem; }
    .h-md { font-size: 1.8rem; }
    .h-lg { font-size: 2.4rem; }
    .h-xl { font-size: 3.2rem; }

    .p-sm { font-size: 0.9rem; }
    .p-md { font-size: 1.1rem; }
    .p-lg { font-size: 1.35rem; }

    /* Font Classes */
    .font-inter { font-family: 'Inter', sans-serif; }
    .font-roboto { font-family: 'Roboto', sans-serif; }
    .font-montserrat { font-family: 'Montserrat', sans-serif; }
    .font-playfair { font-family: 'Playfair Display', serif; }
    .font-merriweather { font-family: 'Merriweather', serif; }
    .font-lora { font-family: 'Lora', serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-oswald { font-family: 'Oswald', sans-serif; }
    .font-mono { font-family: 'Fira Code', monospace; }

    /* Export Modal */
    #export-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #1e293b;
      padding: 24px;
      border-radius: 8px;
      width: 80%;
      max-width: 700px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    .modal-content textarea {
      width: 100%;
      height: 300px;
      background: #0f172a;
      color: #a5f3fc;
      border: 1px solid #334155;
      padding: 12px;
      font-family: monospace;
      margin: 16px 0;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- LEFT SIDEBAR: Visual Controls -->
    <div id="editor-sidebar">
      <div class="sidebar-header">
        <h2>Parallax Story Editor Pro</h2>
        
        <!-- PROJECT MANAGER CONTROLS -->
        <div class="project-bar">
          <select id="project-selector" onchange="switchProject(this.value)">
            <!-- Projects injected dynamically -->
          </select>
          <div class="project-btn-row">
            <button class="btn-sm btn-dark" onclick="createNewProject()">+ New</button>
            <button class="btn-sm btn-dark" onclick="exportProjectJSON()">💾 Save File</button>
            <button class="btn-sm btn-dark" onclick="document.getElementById('import-file-input').click()">📂 Open File</button>
            <button class="btn-sm btn-danger" onclick="deleteCurrentProject()">Delete</button>
            <input type="file" id="import-file-input" accept=".json" style="display:none" onchange="importProjectJSON(this)">
          </div>
        </div>
      </div>

      <div class="scenes-list" id="scenes-container">
        <!-- Scene cards dynamically injected here -->
      </div>

      <div class="sidebar-actions">
        <button class="btn btn-primary" onclick="addScene()">+ Add Scene</button>
        <button class="btn btn-success" onclick="openExportModal()">Export HTML Code</button>
      </div>
    </div>

    <!-- RIGHT STAGE: Live Interactive Parallax Viewport -->
    <div id="preview-viewport">
      <div class="scrolly-container" id="scrolly-stage">
        <!-- Live Scrollytelling content rendered here -->
      </div>
    </div>
  </div>

  <!-- EXPORT CODE MODAL -->
  <div id="export-modal">
    <div class="modal-content">
      <h3 style="color:#38bdf8">Your Clean Standalone HTML</h3>
      <p style="font-size:0.85rem; color:#94a3b8; margin-top:4px;">
        Copy and paste this into your index.html file to publish your custom scrollytelling article!
      </p>
      <textarea id="export-code-output" readonly></textarea>
      <div style="display:flex; justify-content: flex-end; gap:8px;">
        <button class="btn btn-primary" onclick="copyCode()">Copy Code</button>
        <button class="btn" style="background:#475569; color:#fff;" onclick="closeExportModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    // Initial Default Seed Data
    const defaultSeedScenes = [
      {
        id: 1,
        title: "Deep Ocean Discovery",
        text: "As you descend into the bathypelagic zone, sunlight disappears completely.",
        image: "https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=1200&q=80",
        overlayImage: "",
        overlaySpeed: 0.35,
        overlayScale: 1.0,
        overlayPos: "overlay-center",
        scrollDistance: 2.0,
        parallaxSpeed: 0.15,
        scale: 1.25,
        position: "left",
        fontFamily: "font-inter",
        titleSize: "h-md",
        textSize: "p-md",
        textAnimation: "words",
        bgColor: "#0f172a",
        bgOpacity: 0.85,
        textColor: "#ffffff",
        accentColor: "#38bdf8",
        borderRadius: 12,
        padding: 32
      },
      {
        id: 2,
        title: "Bioluminescent Life",
        text: "Organisms create their own light through complex chemical reactions.",
        image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80",
        overlayImage: "",
        overlaySpeed: 0.40,
        overlayScale: 1.0,
        overlayPos: "overlay-right-bottom",
        scrollDistance: 1.5,
        parallaxSpeed: 0.20,
        scale: 1.20,
        position: "right",
        fontFamily: "font-playfair",
        titleSize: "h-lg",
        textSize: "p-md",
        textAnimation: "words",
        bgColor: "#1e1b4b",
        bgOpacity: 0.90,
        textColor: "#f8fafc",
        accentColor: "#a855f7",
        borderRadius: 8,
        padding: 24
      }
    ];

    // Global App State
    let projects = {};
    let activeProjectId = "project_default";
    let scenes = [];

    // Helper: Wrap individual words in animated span tags safely preserving spacing
    function wrapWords(text) {
      if (!text) return '';
      return text.split(' ').map((word, i) => 
        `<span class="word-span" style="--word-index: ${i}">${escapeHtml(word)}</span> `
      ).join('');
    }

    // Helper: Sanitize scene object with fallback defaults
    function sanitizeScene(scene) {
      return {
        ...scene,
        textAnimation: scene.textAnimation || 'words',
        titleSize: scene.titleSize || 'h-md',
        textSize: scene.textSize || 'p-md',
        fontFamily: scene.fontFamily || 'font-inter',
        overlayImage: scene.overlayImage || '',
        overlaySpeed: typeof scene.overlaySpeed !== 'undefined' ? scene.overlaySpeed : 0.35,
        overlayScale: scene.overlayScale || 1.0,
        overlayPos: scene.overlayPos || 'overlay-center',
        scale: scene.scale || 1.20
      };
    }

    // Helper: Save current state to browser memory
    function persistToLocalStorage() {
      if (activeProjectId && projects[activeProjectId]) {
        projects[activeProjectId].scenes = scenes;
      }
      localStorage.setItem('scrolly_projects_db', JSON.stringify(projects));
      localStorage.setItem('scrolly_active_id', activeProjectId);
    }

    // Helper: Load projects from browser memory
    function loadFromLocalStorage() {
      const storedDb = localStorage.getItem('scrolly_projects_db');
      const storedActive = localStorage.getItem('scrolly_active_id');

      if (storedDb) {
        projects = JSON.parse(storedDb);
      } else {
        projects = {
          "project_default": { name: "Ocean Discovery (Demo)", scenes: defaultSeedScenes }
        };
      }

      activeProjectId = storedActive && projects[storedActive] ? storedActive : Object.keys(projects)[0];
      scenes = projects[activeProjectId].scenes.map(sanitizeScene);
      
      updateProjectSelectorUI();
    }

    // Update Project Dropdown Selector
    function updateProjectSelectorUI() {
      const selector = document.getElementById('project-selector');
      selector.innerHTML = '';

      Object.keys(projects).forEach(id => {
        const opt = document.createElement('option');
        opt.value = id;
        opt.innerText = projects[id].name;
        if (id === activeProjectId) opt.selected = true;
        selector.appendChild(opt);
      });
    }

    // Switch between saved projects
    function switchProject(id) {
      if (!projects[id]) return;
      persistToLocalStorage();
      activeProjectId = id;
      scenes = projects[activeProjectId].scenes.map(sanitizeScene);
      persistToLocalStorage();
      renderEditor();
    }

    // Create a new blank project
    function createNewProject() {
      const name = prompt("Enter a name for your new scrollytelling project:", "My New Story");
      if (!name) return;

      const newId = "project_" + Date.now();
      projects[newId] = {
        name: name,
        scenes: [sanitizeScene({
          id: Date.now(),
          title: "Chapter 1",
          text: "Write your opening section text here...",
          image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80",
          scrollDistance: 2.0,
          parallaxSpeed: 0.15,
          scale: 1.20,
          position: "center",
          fontFamily: "font-inter",
          titleSize: "h-md",
          textSize: "p-md",
          textAnimation: "words",
          bgColor: "#0f172a",
          bgOpacity: 0.85,
          textColor: "#ffffff",
          accentColor: "#38bdf8",
          borderRadius: 12,
          padding: 32
        })]
      };

      activeProjectId = newId;
      scenes = projects[activeProjectId].scenes;
      persistToLocalStorage();
      updateProjectSelectorUI();
      renderEditor();
    }

    // Delete current project
    function deleteCurrentProject() {
      if (Object.keys(projects).length <= 1) {
        alert("You must keep at least one project!");
        return;
      }
      if (confirm(`Are you sure you want to delete "${projects[activeProjectId].name}"?`)) {
        delete projects[activeProjectId];
        activeProjectId = Object.keys(projects)[0];
        scenes = projects[activeProjectId].scenes.map(sanitizeScene);
        persistToLocalStorage();
        updateProjectSelectorUI();
        renderEditor();
      }
    }

    // Export Project Backup File (.json)
    function exportProjectJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projects[activeProjectId], null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `${projects[activeProjectId].name.toLowerCase().replace(/[^a-z0-9]/g, '_')}_project.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // Import Project File (.json)
    function importProjectJSON(fileInput) {
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (importedData.name && Array.isArray(importedData.scenes)) {
            const newId = "project_" + Date.now();
            importedData.scenes = importedData.scenes.map(sanitizeScene);
            projects[newId] = importedData;
            activeProjectId = newId;
            scenes = projects[activeProjectId].scenes;
            persistToLocalStorage();
            updateProjectSelectorUI();
            renderEditor();
            alert(`Project "${importedData.name}" imported successfully!`);
          } else {
            alert("Invalid project file format.");
          }
        } catch(err) {
          alert("Error reading JSON file.");
        }
      };
      reader.readAsText(file);
    }

    // Helper: Detect if file path/URL is a video
    function isVideoUrl(url) {
      if (!url) return false;
      const clean = url.toLowerCase().split('?')[0];
      return clean.endsWith('.webm') || clean.endsWith('.mp4') || clean.startsWith('data:video/');
    }

    // Convert hex color + opacity value to RGBA string
    function hexToRgba(hex, opacity) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${opacity})`;
    }

    // Render Editor UI controls
    function renderEditor() {
      const container = document.getElementById('scenes-container');
      container.innerHTML = '';

      scenes.forEach((scene, index) => {
        const card = document.createElement('div');
        card.className = 'scene-card';
        card.innerHTML = `
          <button class="btn-delete" onclick="removeScene(${scene.id})">✕ Remove</button>
          <h3>Scene ${index + 1}</h3>
          
          <div class="form-group">
            <label>Heading</label>
            <input type="text" value="${escapeHtml(scene.title)}" oninput="updateScene(${scene.id}, 'title', this.value)">
          </div>

          <div class="form-group">
            <label>Story Text</label>
            <textarea rows="3" oninput="updateScene(${scene.id}, 'text', this.value)">${escapeHtml(scene.text)}</textarea>
          </div>

          <!-- BACKGROUND MEDIA -->
          <div class="form-group">
            <label>Background Media (Image or WebM/MP4)</label>
            <input type="file" accept="image/*,video/webm,video/mp4" style="margin-bottom: 4px;" onchange="handleFileUpload(${scene.id}, 'image', this)">
            <input type="text" value="${escapeHtml(scene.image)}" placeholder="Image/Video URL or path" onchange="updateScene(${scene.id}, 'image', this.value)">
          </div>

          <!-- FOREGROUND OVERLAY MEDIA -->
          <div class="form-group" style="background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px; border: 1px dashed #475569;">
            <label style="color: #38bdf8;">Foreground Overlay Cutout (Sits over text)</label>
            <input type="file" accept="image/*,video/webm,video/mp4" style="margin-bottom: 4px;" onchange="handleFileUpload(${scene.id}, 'overlayImage', this)">
            <input type="text" value="${escapeHtml(scene.overlayImage || '')}" placeholder="Optional transparent PNG/WebM URL" onchange="updateScene(${scene.id}, 'overlayImage', this.value)">
            
            <div class="form-row" style="margin-top: 6px;">
              <div class="form-group">
                <label>Overlay Alignment</label>
                <select onchange="updateScene(${scene.id}, 'overlayPos', this.value)">
                  <option value="overlay-center" ${scene.overlayPos === 'overlay-center' ? 'selected' : ''}>Center</option>
                  <option value="overlay-right-bottom" ${scene.overlayPos === 'overlay-right-bottom' ? 'selected' : ''}>Bottom Right</option>
                  <option value="overlay-left-bottom" ${scene.overlayPos === 'overlay-left-bottom' ? 'selected' : ''}>Bottom Left</option>
                  <option value="overlay-right-top" ${scene.overlayPos === 'overlay-right-top' ? 'selected' : ''}>Top Right</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label>
                Overlay Scale (Size)
                <span class="range-val" id="ovscale-val-${scene.id}">${scene.overlayScale || 1.0}x</span>
              </label>
              <input type="range" min="0.2" max="2.0" step="0.05" value="${scene.overlayScale || 1.0}" 
                oninput="updateScene(${scene.id}, 'overlayScale', parseFloat(this.value)); document.getElementById('ovscale-val-${scene.id}').innerText = this.value + 'x'">
            </div>

            <div class="form-group">
              <label>
                Overlay Scroll Speed
                <span class="range-val" id="ovspeed-val-${scene.id}">${scene.overlaySpeed || 0.35}</span>
              </label>
              <input type="range" min="0.0" max="0.8" step="0.05" value="${scene.overlaySpeed || 0.35}" 
                oninput="updateScene(${scene.id}, 'overlaySpeed', parseFloat(this.value)); document.getElementById('ovspeed-val-${scene.id}').innerText = this.value">
            </div>
          </div>

          <!-- TEXT ENTRANCE ANIMATION -->
          <div class="form-group">
            <label>Text Entrance Style</label>
            <select onchange="updateScene(${scene.id}, 'textAnimation', this.value)">
              <option value="words" ${scene.textAnimation === 'words' ? 'selected' : ''}>Floating Words (Staggered)</option>
              <option value="none" ${scene.textAnimation === 'none' ? 'selected' : ''}>Static (Always Visible)</option>
            </select>
          </div>

          <!-- FONT SELECTION & SIZING -->
          <div class="form-group">
            <label>Font Family</label>
            <select onchange="updateScene(${scene.id}, 'fontFamily', this.value)">
              <option value="font-inter" ${scene.fontFamily === 'font-inter' ? 'selected' : ''}>Inter (Modern Sans)</option>
              <option value="font-roboto" ${scene.fontFamily === 'font-roboto' ? 'selected' : ''}>Roboto (Clean Sans)</option>
              <option value="font-montserrat" ${scene.fontFamily === 'font-montserrat' ? 'selected' : ''}>Montserrat (Geometric)</option>
              <option value="font-playfair" ${scene.fontFamily === 'font-playfair' ? 'selected' : ''}>Playfair Display (Editorial)</option>

                <option value="p-md" ${scene.textSize === 'p-md' ? 'selected' : ''}>Medium</option>
                <option value="p-lg" ${scene.textSize === 'p-lg' ? 'selected' : ''}>Large</option>

                <option value="center" ${scene.position === 'center' ? 'selected' : ''}>Center</option>

          <!-- SLIDERS -->
          <div class="form-group">
            <label>

        container.appendChild(card);
      });

      renderPreview();
    }

    // Convert local file to Base64
    function handleFileUpload(sceneId, property, inputElement) {
      const file = inputElement.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        updateScene(sceneId, property, e.target.result);
        renderEditor();
      };
      reader.readAsDataURL(file);
    }

    // Render Scrollytelling Stage
    function renderPreview() {
      const stage = document.getElementById('scrolly-stage');
      stage.innerHTML = '';

      scenes.forEach((scene) => {
        const section = document.createElement('div');
        section.className = 'scrolly-section';
        section.id = `section-${scene.id}`;
        section.style.height = `${scene.scrollDistance * 100}vh`;

        const rgbaBg = hexToRgba(scene.bgColor, scene.bgOpacity);

        // Render Background Media
        const mediaHtml = isVideoUrl(scene.image)
          ? `<video id="img-${scene.id}" autoplay loop muted playsinline style="transform: scale(${scene.scale});">
               <source src="${scene.image}">
             </video>`
          : `<img id="img-${scene.id}" src="${scene.image}" alt="${escapeHtml(scene.title)}" style="transform: scale(${scene.scale});">`;

        // Render Optional Overlay Media
        let overlayHtml = '';
        if (scene.overlayImage) {
          overlayHtml = isVideoUrl(scene.overlayImage)
            ? `<div class="sticky-overlay-wrapper ${scene.overlayPos || 'overlay-center'}">
                 <video id="overlay-${scene.id}" autoplay loop muted playsinline style="transform: scale(${scene.overlayScale || 1.0});">
                   <source src="${scene.overlayImage}">
                 </video>
               </div>`
            : `<div class="sticky-overlay-wrapper ${scene.overlayPos || 'overlay-center'}">
                 <img id="overlay-${scene.id}" src="${scene.overlayImage}" alt="Foreground Overlay" style="transform: scale(${scene.overlayScale || 1.0});">
               </div>`;
        }

        // Format Text with Spans if Animated
        const titleHtml = scene.textAnimation === 'none' 
          ? escapeHtml(scene.title) 
          : wrapWords(scene.title);

        const bodyHtml = scene.textAnimation === 'none' 
          ? escapeHtml(scene.text) 
          : wrapWords(scene.text);

        section.innerHTML = `
          <div class="sticky-media-wrapper">
            ${mediaHtml}
          </div>
          ${overlayHtml}
          <div class="text-content-wrapper pos-${scene.position}" style="margin-top: -80vh;">
            <div class="text-card ${scene.fontFamily}" style="
              background: ${rgbaBg};
              backdrop-filter: blur(8px);
              border-radius: ${scene.borderRadius}px;
              padding: ${scene.padding}px;
              border: 1px solid rgba(255, 255, 255, 0.15);
            ">
              <h2 class="${scene.titleSize || 'h-md'}" style="color: ${scene.accentColor}">${titleHtml}</h2>
              <p class="${scene.textSize || 'p-md'}" style="color: ${scene.textColor}">${bodyHtml}</p>
            </div>
          </div>
        `;
        stage.appendChild(section);
      });
    }

    // Smooth Inertia Animation Loop (Linear Interpolation)
    function smoothRenderLoop() {
      const vh = window.innerHeight;

      scenes.forEach(scene => {
        const section = document.getElementById(`section-${scene.id}`);
        const media = document.getElementById(`img-${scene.id}`);
        const overlay = document.getElementById(`overlay-${scene.id}`);

        if (!section) return;

        const rect = section.getBoundingClientRect();
        
        if (rect.top <= vh && rect.bottom >= 0) {
          const totalDistance = rect.height + vh;
          const currentProgress = (vh - rect.top) / totalDistance;
          const offsetProgress = currentProgress - 0.5;

          // Transform Background Media
          if (media) {
            const translateY = offsetProgress * (vh * scene.parallaxSpeed * 2);
            media.style.transform = `scale(${scene.scale}) translateY(${translateY}px)`;
          }

          // Transform Foreground Overlay Media (Scale + Motion Translation)
          if (overlay) {
            const overlayTranslateY = offsetProgress * (vh * (scene.overlaySpeed || 0.35) * 2);
            overlay.style.transform = `scale(${scene.overlayScale || 1.0}) translateY(${overlayTranslateY}px)`;
          }

          // Trigger Word-by-Word Floating Entrance when crossing threshold
          const textCard = document.querySelector(`#section-${scene.id} .text-card`);
          if (textCard && scene.textAnimation !== 'none') {
            if (rect.top <= vh * 0.85 && rect.bottom >= vh * 0.15) {
              textCard.classList.add('animate-words');
            } else {
              textCard.classList.remove('animate-words');
            }
          }
        }
      });

      requestAnimationFrame(smoothRenderLoop);
    }

    // Data Operations
    function addScene() {
      const newId = Date.now();
      scenes.push(sanitizeScene({
        id: newId,
        title: "New Story Beat",
        text: "Add your customized text content here...",
        image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80",
        overlayImage: "",
        overlaySpeed: 0.35,
        overlayScale: 1.0,
        overlayPos: "overlay-center",
        scrollDistance: 2.0,
        parallaxSpeed: 0.15,
        scale: 1.20,
        position: "center",
        fontFamily: "font-inter",
        titleSize: "h-md",
        textSize: "p-md",
        textAnimation: "words",
        bgColor: "#0f172a",
        bgOpacity: 0.85,
        textColor: "#ffffff",
        accentColor: "#38bdf8",
        borderRadius: 12,
        padding: 32
      }));
      persistToLocalStorage();
      renderEditor();
    }

    function removeScene(id) {
      scenes = scenes.filter(s => s.id !== id);
      persistToLocalStorage();
      renderEditor();
    }

    function updateScene(id, field, value) {
      const scene = scenes.find(s => s.id === id);
      if (scene) {
        scene[field] = value;
        persistToLocalStorage();
        renderPreview();
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Modal & Export Code Logic
    function openExportModal() {
      const modal = document.getElementById('export-modal');
      const output = document.getElementById('export-code-output');
      modal.style.display = 'flex';
      output.value = generateCleanHTML();
    }

    function closeExportModal() {
      document.getElementById('export-modal').style.display = 'none';
    }

    function copyCode() {
      const output = document.getElementById('export-code-output');
      output.select();
      document.execCommand('copy');
      alert('Standalone website code copied to clipboard!');
    }

    function generateCleanHTML() {
      return `<!DOCTYPE html>

    .font-cinzel { font-family: 'Cinzel', serif; } .font-oswald { font-family: 'Oswald', sans-serif; } .font-mono { font-family: 'Fira Code', monospace; }

<body>

    }

    // Initialize App
    loadFromLocalStorage();
    renderEditor();
    smoothRenderLoop();
  </script>
</body>
