<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrollytelling Parallax Editor Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Fira+Code&family=Inter:wght@400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; overflow: hidden; }

    /* App Layout */
    #app-container { display: flex; height: 100vh; width: 100vw; }
    
    /* Control Panel (Sidebar) */
    #editor-sidebar {
      width: 420px;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 4px 0 20px rgba(0,0,0,0.3);
    }
    .sidebar-header {
      padding: 18px 20px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }
    .sidebar-header h2 { font-size: 1.1rem; color: #38bdf8; font-weight: 600; }
    .scenes-list { flex: 1; overflow-y: auto; padding: 16px; }
    
    /* Scene Card in Editor */
    .scene-card {
      background: #334155;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid #475569;
      position: relative;
    }
    .scene-card h3 { font-size: 0.9rem; color: #38bdf8; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    
    /* Form Elements */
    .form-group { margin-bottom: 12px; }
    .form-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .form-row .form-group { flex: 1; margin-bottom: 0; }
    .form-group label { display: block; font-size: 0.75rem; color: #cbd5e1; margin-bottom: 4px; font-weight: 600; }
    .form-group input[type="text"], 
    .form-group textarea, 
    .form-group select {
      width: 100%;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 8px;
      color: #fff;
      font-size: 0.85rem;
    }
    .form-group input[type="color"] {
      width: 100%;
      height: 36px;
      border: 1px solid #475569;
      background: #1e293b;
      border-radius: 4px;
      cursor: pointer;
    }
    .form-group input[type="range"] { width: 100%; }
    .range-val { font-size: 0.75rem; color: #38bdf8; float: right; }
    
    .btn-delete {
      position: absolute;
      top: 14px; right: 14px;
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .sidebar-actions { padding: 16px; border-top: 1px solid #334155; display: flex; gap: 8px; background: #0f172a; }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-primary:hover { background: #0369a1; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-success:hover { background: #15803d; }

    /* Live Preview Area */
    #preview-viewport {
      flex: 1;
      overflow-y: auto;
      height: 100vh;
      position: relative;
      background: #000;
      scroll-behavior: smooth;
    }

    /* Scrollytelling Stage Styles */
    .scrolly-container { position: relative; width: 100%; }
    .scrolly-section { position: relative; width: 100%; }

    /* Sticky Media Stage */
    .sticky-media-wrapper {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      z-index: 1;
    }
    .sticky-media-wrapper img,
    .sticky-media-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      will-change: transform;
      transition: transform 0.05s linear;
    }

    /* Text Block Container Overlay */
    .text-content-wrapper {
      position: relative;
      z-index: 2;
      pointer-events: none;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
    }
    
    /* Position Classes */
    .pos-left { justify-content: flex-start; }
    .pos-center { justify-content: center; }
    .pos-right { justify-content: flex-end; }

    .text-card {
      max-width: 500px;
      width: 100%;
      margin-bottom: 80vh;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
      transition: background 0.2s ease, color 0.2s ease;
    }
    .text-card h2 { font-size: 1.8rem; margin-bottom: 12px; line-height: 1.2; }
    .text-card p { font-size: 1.05rem; line-height: 1.6; }

    /* Font Classes */
    .font-sans { font-family: 'Inter', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
    .font-mono { font-family: 'Fira Code', monospace; }
    .font-display { font-family: 'Cinzel', serif; }

    /* Export Modal */
    #export-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #1e293b;
      padding: 24px;
      border-radius: 8px;
      width: 80%;
      max-width: 700px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    .modal-content textarea {
      width: 100%;
      height: 300px;
      background: #0f172a;
      color: #a5f3fc;
      border: 1px solid #334155;
      padding: 12px;
      font-family: monospace;
      margin: 16px 0;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- LEFT SIDEBAR: Visual Controls -->
    <div id="editor-sidebar">
      <div class="sidebar-header">
        <h2>Parallax Story Editor Pro</h2>
      </div>

      <div class="scenes-list" id="scenes-container">
        <!-- Scene cards dynamically injected here -->
      </div>

      <div class="sidebar-actions">
        <button class="btn btn-primary" onclick="addScene()">+ Add Scene</button>
        <button class="btn btn-success" onclick="openExportModal()">Export Code</button>
      </div>
    </div>

    <!-- RIGHT STAGE: Live Interactive Parallax Viewport -->
    <div id="preview-viewport" onscroll="handleScroll()">
      <div class="scrolly-container" id="scrolly-stage">
        <!-- Live Scrollytelling content rendered here -->
      </div>
    </div>
  </div>

  <!-- EXPORT CODE MODAL -->
  <div id="export-modal">
    <div class="modal-content">
      <h3 style="color:#38bdf8">Your Clean Standalone HTML</h3>
      <p style="font-size:0.85rem; color:#94a3b8; margin-top:4px;">
        Copy and paste this into your index.html file to publish your custom scrollytelling article!
      </p>
      <textarea id="export-code-output" readonly></textarea>
      <div style="display:flex; justify-content: flex-end; gap:8px;">
        <button class="btn btn-primary" onclick="copyCode()">Copy Code</button>
        <button class="btn" style="background:#475569; color:#fff;" onclick="closeExportModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    // Initial Default Story Data
    let scenes = [
      {
        id: 1,
        title: "Deep Ocean Discovery",
        text: "As you descend into the bathypelagic zone, sunlight disappears completely.",
        image: "https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=1200&q=80",
        scrollDistance: 2.0,
        parallaxSpeed: 0.15,
        scale: 1.25, // Default overscan zoom
        position: "left",
        fontFamily: "font-sans",
        bgColor: "#0f172a",
        bgOpacity: 0.85,
        textColor: "#ffffff",
        accentColor: "#38bdf8",
        borderRadius: 12,
        padding: 32
      },
      {
        id: 2,
        title: "Bioluminescent Life",
        text: "Organisms create their own light through complex chemical reactions.",
        image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80",
        scrollDistance: 1.5,
        parallaxSpeed: 0.20,
        scale: 1.20,
        position: "right",
        fontFamily: "font-serif",
        bgColor: "#1e1b4b",
        bgOpacity: 0.90,
        textColor: "#f8fafc",
        accentColor: "#a855f7",
        borderRadius: 8,
        padding: 24
      }
    ];

    // Helper: Detect if file path/URL is a video
    function isVideoUrl(url) {
      if (!url) return false;
      const clean = url.toLowerCase().split('?')[0];
      return clean.endsWith('.webm') || clean.endsWith('.mp4') || clean.startsWith('data:video/');
    }

    // Convert hex color + opacity value to RGBA string
    function hexToRgba(hex, opacity) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${opacity})`;
    }

    // Render Editor UI controls
    function renderEditor() {
      const container = document.getElementById('scenes-container');
      container.innerHTML = '';

      scenes.forEach((scene, index) => {
        const card = document.createElement('div');
        card.className = 'scene-card';
        card.innerHTML = `
          <button class="btn-delete" onclick="removeScene(${scene.id})">✕ Remove</button>
          <h3>Scene ${index + 1}</h3>
          
          <div class="form-group">
            <label>Heading</label>
            <input type="text" value="${escapeHtml(scene.title)}" oninput="updateScene(${scene.id}, 'title', this.value)">
          </div>

          <div class="form-group">
            <label>Story Text</label>
            <textarea rows="2" oninput="updateScene(${scene.id}, 'text', this.value)">${escapeHtml(scene.text)}</textarea>
          </div>

          <!-- LOCAL FILE UPLOAD + URL/PATH INPUT -->
          <div class="form-group">
            <label>Media Source (Image or WebM/MP4 Video)</label>
            <input type="file" accept="image/*,video/webm,video/mp4" style="margin-bottom: 6px;" onchange="handleFileUpload(${scene.id}, this)">
            <input type="text" value="${escapeHtml(scene.image)}" placeholder="Paste Image/WebM URL or relative path" onchange="updateScene(${scene.id}, 'image', this.value)">
          </div>

          <!-- LAYOUT & POSITIONING -->
          <div class="form-row">
            <div class="form-group">
              <label>Page Location</label>
              <select onchange="updateScene(${scene.id}, 'position', this.value)">
                <option value="left" ${scene.position === 'left' ? 'selected' : ''}>Left</option>
                <option value="center" ${scene.position === 'center' ? 'selected' : ''}>Center</option>
                <option value="right" ${scene.position === 'right' ? 'selected' : ''}>Right</option>
              </select>
            </div>
            <div class="form-group">
              <label>Font Family</label>
              <select onchange="updateScene(${scene.id}, 'fontFamily', this.value)">
                <option value="font-sans" ${scene.fontFamily === 'font-sans' ? 'selected' : ''}>Sans-Serif (Modern)</option>
                <option value="font-serif" ${scene.fontFamily === 'font-serif' ? 'selected' : ''}>Serif (Editorial)</option>
                <option value="font-mono" ${scene.fontFamily === 'font-mono' ? 'selected' : ''}>Monospace (Tech)</option>
                <option value="font-display" ${scene.fontFamily === 'font-display' ? 'selected' : ''}>Display (Cinematic)</option>
              </select>
            </div>
          </div>

          <!-- COLOR PICKERS -->
          <div class="form-row">
            <div class="form-group">
              <label>Card BG Color</label>
              <input type="color" value="${scene.bgColor}" onchange="updateScene(${scene.id}, 'bgColor', this.value)">
            </div>
            <div class="form-group">
              <label>Heading Color</label>
              <input type="color" value="${scene.accentColor}" onchange="updateScene(${scene.id}, 'accentColor', this.value)">
            </div>
            <div class="form-group">
              <label>Body Text Color</label>
              <input type="color" value="${scene.textColor}" onchange="updateScene(${scene.id}, 'textColor', this.value)">
            </div>
          </div>

          <!-- SLIDERS -->
          <div class="form-group">
            <label>
              Image Scale (Overscan Padding)
              <span class="range-val" id="scale-val-${scene.id}">${scene.scale}x</span>
            </label>
            <input type="range" min="1.05" max="1.50" step="0.05" value="${scene.scale}" 
              oninput="updateScene(${scene.id}, 'scale', parseFloat(this.value)); document.getElementById('scale-val-${scene.id}').innerText = this.value + 'x'">
          </div>

          <div class="form-group">
            <label>
              Background Opacity
              <span class="range-val" id="opac-val-${scene.id}">${Math.round(scene.bgOpacity * 100)}%</span>
            </label>
            <input type="range" min="0.0" max="1.0" step="0.05" value="${scene.bgOpacity}" 
              oninput="updateScene(${scene.id}, 'bgOpacity', parseFloat(this.value)); document.getElementById('opac-val-${scene.id}').innerText = Math.round(this.value * 100) + '%'">
          </div>

          <div class="form-group">
            <label>
              Scroll Distance (Sticky Duration)
              <span class="range-val" id="dist-val-${scene.id}">${scene.scrollDistance}x Viewport</span>
            </label>
            <input type="range" min="1.0" max="4.0" step="0.25" value="${scene.scrollDistance}" 
              oninput="updateScene(${scene.id}, 'scrollDistance', parseFloat(this.value)); document.getElementById('dist-val-${scene.id}').innerText = this.value + 'x Viewport'">
          </div>

          <div class="form-group">
            <label>
              Parallax Depth Intensity
              <span class="range-val" id="speed-val-${scene.id}">${scene.parallaxSpeed}</span>
            </label>
            <input type="range" min="0.0" max="0.4" step="0.02" value="${scene.parallaxSpeed}" 
              oninput="updateScene(${scene.id}, 'parallaxSpeed', parseFloat(this.value)); document.getElementById('speed-val-${scene.id}').innerText = this.value">
          </div>
        `;
        container.appendChild(card);
      });

      renderPreview();
    }

    // Convert local file to Base64
    function handleFileUpload(sceneId, inputElement) {
      const file = inputElement.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        updateScene(sceneId, 'image', e.target.result);
        renderEditor();
      };
      reader.readAsDataURL(file);
    }

    // Render Scrollytelling Stage
    function renderPreview() {
      const stage = document.getElementById('scrolly-stage');
      stage.innerHTML = '';

      scenes.forEach((scene) => {
        const section = document.createElement('div');
        section.className = 'scrolly-section';
        section.id = `section-${scene.id}`;
        section.style.height = `${scene.scrollDistance * 100}vh`;

        const rgbaBg = hexToRgba(scene.bgColor, scene.bgOpacity);

        // Render image or video with default initial scale transform
        const mediaHtml = isVideoUrl(scene.image)
          ? `<video id="img-${scene.id}" autoplay loop muted playsinline style="width:100%; height:100%; object-fit:cover; transform: scale(${scene.scale});">
               <source src="${scene.image}">
             </video>`
          : `<img id="img-${scene.id}" src="${scene.image}" alt="${escapeHtml(scene.title)}" style="transform: scale(${scene.scale});">`;

        section.innerHTML = `
          <div class="sticky-media-wrapper">
            ${mediaHtml}
          </div>
          <div class="text-content-wrapper pos-${scene.position}" style="margin-top: -80vh;">
            <div class="text-card ${scene.fontFamily}" style="
              background: ${rgbaBg};
              backdrop-filter: blur(8px);
              border-radius: ${scene.borderRadius}px;
              padding: ${scene.padding}px;
              border: 1px solid rgba(255, 255, 255, 0.15);
            ">
              <h2 style="color: ${scene.accentColor}">${escapeHtml(scene.title)}</h2>
              <p style="color: ${scene.textColor}">${escapeHtml(scene.text)}</p>
            </div>
          </div>
        `;
        stage.appendChild(section);
      });

      handleScroll(); // Initial position calculation
    }

    // Normalized Parallax Engine (Prevents Black Gaps & Uncouples Text Movement)
    function handleScroll() {
      const vh = window.innerHeight;

      scenes.forEach(scene => {
        const section = document.getElementById(`section-${scene.id}`);
        const media = document.getElementById(`img-${scene.id}`);
        if (!section || !media) return;

        const rect = section.getBoundingClientRect();
        
        // Check if section is visible inside viewport
        if (rect.top <= vh && rect.bottom >= 0) {
          const totalDistance = rect.height + vh;
          const currentProgress = (vh - rect.top) / totalDistance; // 0.0 to 1.0
          
          // Center transformation around 0.5 mid-point
          const offsetProgress = currentProgress - 0.5; 
          const translateY = offsetProgress * (vh * scene.parallaxSpeed * 2);

          media.style.transform = `scale(${scene.scale}) translateY(${translateY}px)`;
        }
      });
    }

    // Data Operations
    function addScene() {
      const newId = Date.now();
      scenes.push({
        id: newId,
        title: "New Story Beat",
        text: "Add your customized text content here...",
        image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80",
        scrollDistance: 2.0,
        parallaxSpeed: 0.15,
        scale: 1.20,
        position: "center",
        fontFamily: "font-sans",
        bgColor: "#0f172a",
        bgOpacity: 0.85,
        textColor: "#ffffff",
        accentColor: "#38bdf8",
        borderRadius: 12,
        padding: 32
      });
      renderEditor();
    }

    function removeScene(id) {
      scenes = scenes.filter(s => s.id !== id);
      renderEditor();
    }

    function updateScene(id, field, value) {
      const scene = scenes.find(s => s.id === id);
      if (scene) {
        scene[field] = value;
        renderPreview();
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Modal & Export Code Logic
    function openExportModal() {
      const modal = document.getElementById('export-modal');
      const output = document.getElementById('export-code-output');
      modal.style.display = 'flex';
      output.value = generateCleanHTML();
    }

    function closeExportModal() {
      document.getElementById('export-modal').style.display = 'none';
    }

    function copyCode() {
      const output = document.getElementById('export-code-output');
      output.select();
      document.execCommand('copy');
      alert('Standalone website code copied to clipboard!');
    }

    function generateCleanHTML() {
      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrollytelling Article</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Fira+Code&family=Inter:wght@400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #fff; }
    .scrolly-section { position: relative; width: 100%; }
    .sticky-media-wrapper { position: sticky; top: 0; width: 100%; height: 100vh; overflow: hidden; z-index: 1; }
    .sticky-media-wrapper img,
    .sticky-media-wrapper video { width: 100%; height: 100%; object-fit: cover; will-change: transform; transition: transform 0.05s linear; }
    .text-content-wrapper { position: relative; z-index: 2; max-width: 1100px; margin: 0 auto; padding: 0 20px; display: flex; }
    .pos-left { justify-content: flex-start; }
    .pos-center { justify-content: center; }
    .pos-right { justify-content: flex-end; }
    .text-card { max-width: 500px; width: 100%; margin-bottom: 80vh; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    .text-card h2 { font-size: 1.8rem; margin-bottom: 12px; line-height: 1.2; }
    .text-card p { font-size: 1.05rem; line-height: 1.6; }
    .font-sans { font-family: 'Inter', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
    .font-mono { font-family: 'Fira Code', monospace; }
    .font-display { font-family: 'Cinzel', serif; }
  </style>
</head>
<body>
  ${document.getElementById('scrolly-stage').innerHTML}

  <script>
    const scenes = ${JSON.stringify(scenes)};
    window.addEventListener('scroll', () => {
      const vh = window.innerHeight;
      scenes.forEach(scene => {
        const section = document.getElementById('section-' + scene.id);
        const media = document.getElementById('img-' + scene.id);
        if (!section || !media) return;
        const rect = section.getBoundingClientRect();
        if (rect.top <= vh && rect.bottom >= 0) {
          const totalDistance = rect.height + vh;
          const currentProgress = (vh - rect.top) / totalDistance;
          const offsetProgress = currentProgress - 0.5;
          const translateY = offsetProgress * (vh * scene.parallaxSpeed * 2);
          media.style.transform = 'scale(' + scene.scale + ') translateY(' + translateY + 'px)';
        }
      });
    });
  <\/script>
</body>
</html>`;
    }

    // Initialize on load
    renderEditor();
  </script>
</body>
</html>
